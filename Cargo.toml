[package]
name = "niri-tonic-files"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
description = "A quiet, column-based Wayland file explorer for Niri and Dank Material Shell"
license = "GPL-3.0-only"
repository = "https://github.com/niri-tonic/niri-tonic-files"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gio-unix = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
rustix = { version = "1", features = ["fs"] }
tempfile = "3"
notify = "8"
async-channel = "2"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "niri-tonic-files"
path = "src/main.rs"
