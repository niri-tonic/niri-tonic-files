[changelog]
header = """
# Changelog

All notable changes are documented here using Keep a Changelog and Semantic Versioning.

## Unreleased

"""
body = """
{%- if version -%}
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- endif -%}
{%- for group in ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"] -%}
{%- set entries = commits | filter(attribute="group", value=group) -%}
{%- if entries | length > 0 -%}
{{ "\n\n" }}### {{ group }}{{ "\n" }}
{%- for commit in entries -%}
{{ "\n" }}- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking_description %}: {{ commit.breaking_description }}{% endif %}
{%- endfor -%}
{%- endif -%}
{%- endfor -%}
{%- if version -%}
{{ "\n\n" }}[{{ version }}]: https://github.com/niri-tonic/niri-tonic-files/
{%- if previous.version -%}
compare/{{ previous.version }}...{{ version }}{{ "\n" }}
{%- else -%}
releases/tag/{{ version }}
{%- endif -%}
{{ "\n" }}
{%- endif -%}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
split_commits = false
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
  { breaking = true, group = "Changed" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^(fix|feat)\\(security\\)", group = "Security" },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^deprecate", group = "Deprecated" },
  { message = "^remove", group = "Removed" },
  { message = ".*", skip = true },
]

[bump]
# The planner rejects no-bump histories; note filtering never decides bumps.
initial_tag = "1.0.0"
features_always_bump_minor = true
breaking_always_bump_major = false
