[changelog]
header = """
# Changelog

All notable changes are documented here using Keep a Changelog and Semantic Versioning.

## Unreleased

"""
body = """
{% if version %}## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% for group in ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"] %}
{% set entries = commits | filter(attribute="group", value=group) %}
{% if entries | length > 0 %}
### {{ group }}
{% for commit in entries %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking_description %}: {{ commit.breaking_description }}{% endif %}
{% endfor %}
{% endif %}
{% endfor %}
{% if version %}
{% if previous.version %}[{{ version }}]: https://github.com/niri-tonic/niri-tonic-files/compare/{{ previous.version }}...{{ version }}
{% else %}[{{ version }}]: https://github.com/niri-tonic/niri-tonic-files/releases/tag/{{ version }}
{% endif %}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
split_commits = false
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
  { breaking = true, group = "Changed" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^(fix|feat)\\(security\\)", group = "Security" },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^deprecate", group = "Deprecated" },
  { message = "^remove", group = "Removed" },
  { message = ".*", skip = true },
]

[bump]
# The planner requires explicit initial-release=true before choosing 1.0.0.
# It independently rejects no-bump histories; note filtering never decides bumps.
initial_tag = "1.0.0"
features_always_bump_minor = true
breaking_always_bump_major = false
